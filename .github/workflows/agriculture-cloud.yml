name: Cloud Agriculture SME2 publication

on:
  workflow_dispatch:
    inputs:
      west:
        description: AOI west longitude (WGS84)
        required: true
        type: string
      south:
        description: AOI south latitude (WGS84)
        required: true
        type: string
      east:
        description: AOI east longitude (WGS84)
        required: true
        type: string
      north:
        description: AOI north latitude (WGS84)
        required: true
        type: string
      start:
        description: First SME2 search date (YYYY-MM-DD; not before 2026-06-17)
        required: true
        type: string
      end:
        description: Last SME2 search date (YYYY-MM-DD)
        required: true
        type: string
      series_id:
        description: Optional compatible SME2 series ID from a previous search (leave blank for unique best series)
        required: false
        type: string
      dynamic_world_run_id:
        description: Optional successful Dynamic World crop-evidence workflow run ID; leave blank to skip crop-area analysis
        required: false
        type: string
      algorithm:
        description: Root baseline product or explicit DSG algorithm candidate
        required: true
        default: baseline
        type: choice
        options: [baseline, DSG]
      allow_missing_imerg:
        description: Publish valid SME2 evidence if Final IMERG windows are not yet available
        required: true
        default: true
        type: boolean
  push:
    branches: [master]
    paths:
      - 'pipeline/agriculture-cloud-request.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: agriculture-cloud-publication
  cancel-in-progress: false

jobs:
  process-and-publish:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN_ID: agri-${{ github.run_id }}

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Resolve AOI and date inputs
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_WEST: ${{ inputs.west }}
          INPUT_SOUTH: ${{ inputs.south }}
          INPUT_EAST: ${{ inputs.east }}
          INPUT_NORTH: ${{ inputs.north }}
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_SERIES_ID: ${{ inputs.series_id }}
          INPUT_ALGORITHM: ${{ inputs.algorithm }}
          INPUT_ALLOW_MISSING_IMERG: ${{ inputs.allow_missing_imerg }}
          INPUT_DYNAMIC_WORLD_RUN_ID: ${{ inputs.dynamic_world_run_id }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            REQUEST_FILE="pipeline/agriculture-cloud-request.json"
            if [ ! -f "$REQUEST_FILE" ]; then
              echo "::error::Missing $REQUEST_FILE."
              exit 1
            fi
            WEST=$(jq -r '.west // empty' "$REQUEST_FILE")
            SOUTH=$(jq -r '.south // empty' "$REQUEST_FILE")
            EAST=$(jq -r '.east // empty' "$REQUEST_FILE")
            NORTH=$(jq -r '.north // empty' "$REQUEST_FILE")
            START_DATE=$(jq -r '.start // empty' "$REQUEST_FILE")
            END_DATE=$(jq -r '.end // empty' "$REQUEST_FILE")
            SERIES_ID=$(jq -r '.series_id // empty' "$REQUEST_FILE")
            ALGORITHM=$(jq -r '.algorithm // "baseline"' "$REQUEST_FILE")
            ALLOW_MISSING=$(jq -r 'if has("allow_missing_imerg") then .allow_missing_imerg else true end' "$REQUEST_FILE")
            DYNAMIC_WORLD_RUN_ID=$(jq -r '.dynamic_world_run_id // empty' "$REQUEST_FILE")
          else
            WEST="$INPUT_WEST"
            SOUTH="$INPUT_SOUTH"
            EAST="$INPUT_EAST"
            NORTH="$INPUT_NORTH"
            START_DATE="$INPUT_START"
            END_DATE="$INPUT_END"
            SERIES_ID="$INPUT_SERIES_ID"
            ALGORITHM="$INPUT_ALGORITHM"
            ALLOW_MISSING="$INPUT_ALLOW_MISSING_IMERG"
            DYNAMIC_WORLD_RUN_ID="$INPUT_DYNAMIC_WORLD_RUN_ID"
          fi
          for name in WEST SOUTH EAST NORTH START_DATE END_DATE; do
            if [ -z "${!name}" ]; then
              echo "::error::Required AOI/date value $name is missing."
              exit 1
            fi
          done
          if [ "$ALGORITHM" != "baseline" ] && [ "$ALGORITHM" != "DSG" ]; then
            echo "::error::ALGORITHM must be baseline or DSG."
            exit 1
          fi
          if [ -n "$SERIES_ID" ] && [[ ! "$SERIES_ID" =~ ^[a-f0-9]{12}$ ]]; then
            echo "::error::SERIES_ID must be a 12-character lowercase hexadecimal CMR series ID."
            exit 1
          fi
          if [ "$ALLOW_MISSING" != "true" ] && [ "$ALLOW_MISSING" != "false" ]; then
            echo "::error::ALLOW_MISSING_IMERG must be true or false."
            exit 1
          fi
          if [ -n "$DYNAMIC_WORLD_RUN_ID" ] && [[ ! "$DYNAMIC_WORLD_RUN_ID" =~ ^[0-9]{6,20}$ ]]; then
            echo "::error::DYNAMIC_WORLD_RUN_ID must be a numeric GitHub Actions run ID."
            exit 1
          fi
          python - "$WEST" "$SOUTH" "$EAST" "$NORTH" "$START_DATE" "$END_DATE" <<'PY'
          import sys
          from datetime import date
          west, south, east, north = map(float, sys.argv[1:5])
          start_text, end_text = sys.argv[5:7]
          try:
              start, end = map(date.fromisoformat, (start_text, end_text))
          except ValueError as exc:
              raise SystemExit("Dates must use the exact YYYY-MM-DD format.") from exc
          if start.isoformat() != start_text or end.isoformat() != end_text:
              raise SystemExit("Dates must use the exact YYYY-MM-DD format.")
          if not (-180 <= west < east <= 180 and -90 <= south < north <= 90):
              raise SystemExit("AOI must be a valid WGS84 bounding box.")
          if east - west > 2 or north - south > 2:
              raise SystemExit("AOI must not exceed 2 degrees in either dimension.")
          if (start.isoformat() < "2026-06-17" or start > end or end > date.today()
                  or (end - start).days > 366):
              raise SystemExit("Date range is invalid, future-dated, exceeds 366 days, or starts before 2026-06-17.")
          PY
          {
            printf 'west=%s\n' "$WEST"
            printf 'south=%s\n' "$SOUTH"
            printf 'east=%s\n' "$EAST"
            printf 'north=%s\n' "$NORTH"
            printf 'start=%s\n' "$START_DATE"
            printf 'end=%s\n' "$END_DATE"
            printf 'series_id=%s\n' "$SERIES_ID"
            printf 'algorithm=%s\n' "$ALGORITHM"
            printf 'allow_missing_imerg=%s\n' "$ALLOW_MISSING"
            printf 'dynamic_world_run_id=%s\n' "$DYNAMIC_WORLD_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Agriculture pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r pipeline/requirements.txt

      - name: Discover compatible NISAR SME2 acquisitions
        env:
          WEST: ${{ steps.request.outputs.west }}
          SOUTH: ${{ steps.request.outputs.south }}
          EAST: ${{ steps.request.outputs.east }}
          NORTH: ${{ steps.request.outputs.north }}
          START_DATE: ${{ steps.request.outputs.start }}
          END_DATE: ${{ steps.request.outputs.end }}
        run: |
          python pipeline/agriculture_sme2.py search \
            --run-id "$RUN_ID" \
            --west "$WEST" --south "$SOUTH" --east "$EAST" --north "$NORTH" \
            --start "$START_DATE" --end "$END_DATE"

      - name: Validate secure Earthdata configuration
        shell: bash
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTH_DATA }}
        run: |
          if [ -z "${EARTHDATA_TOKEN}" ]; then
            echo "::error::Add an Actions secret named EARTH_DATA before running this workflow."
            exit 1
          fi
          echo "Cloud runner is configured for non-interactive Earthdata authentication."

      - name: Download the exact selected SME2 series
        shell: bash
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTH_DATA }}
          SERIES_ID: ${{ steps.request.outputs.series_id }}
        run: |
          if [ -n "$SERIES_ID" ]; then
            python pipeline/agriculture_sme2.py download --run-id "$RUN_ID" --series-id "$SERIES_ID"
          else
            python pipeline/agriculture_sme2.py download --run-id "$RUN_ID"
          fi

      - name: Resolve and verify optional Dynamic World workflow run
        id: crop-mask
        env:
          DYNAMIC_WORLD_RUN_ID: ${{ steps.request.outputs.dynamic_world_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$DYNAMIC_WORLD_RUN_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No independent crop mask selected; Agriculture will remain NOT ASSESSED for crop observability."
            exit 0
          fi
          if [[ ! "$DYNAMIC_WORLD_RUN_ID" =~ ^[0-9]{6,20}$ ]]; then
            echo "::error::Dynamic World run ID is not a numeric GitHub Actions run ID."
            exit 1
          fi
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/agriculture-dynamic-world.yml" --jq '.id')"
          if [[ ! "$workflow_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve the Dynamic World acquisition workflow ID."
            exit 1
          fi
          run_json="$RUNNER_TEMP/dynamic-world-source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DYNAMIC_WORLD_RUN_ID" > "$run_json"
          if ! jq --exit-status --arg repo "$GITHUB_REPOSITORY" --argjson workflow_id "$workflow_id" '
            .workflow_id == $workflow_id
            and .event == "workflow_dispatch"
            and .head_branch == "master"
            and .status == "completed"
            and .conclusion == "success"
            and .repository.full_name == $repo
            and .head_repository.full_name == $repo
          ' "$run_json" > /dev/null; then
            echo "::error::The supplied run is not a successful master-branch Dynamic World acquisition in this repository."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download the selected Dynamic World evidence artifact
        if: steps.crop-mask.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: agriculture-dynamic-world-crop-evidence-${{ steps.request.outputs.dynamic_world_run_id }}
          path: ${{ runner.temp }}/dynamic-world-crop-mask
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.dynamic_world_run_id }}
          github-token: ${{ github.token }}

      - name: Validate Dynamic World evidence against the selected SME2 series
        id: crop-mask-evidence
        if: steps.crop-mask.outputs.enabled == 'true'
        env:
          MASK_DIR: ${{ runner.temp }}/dynamic-world-crop-mask
          SME2_RUN_ID: ${{ env.RUN_ID }}
        run: |
          set -euo pipefail
          python pipeline/validate_dynamic_world_crop_artifact.py \
            --artifact-dir "$MASK_DIR" \
            --search-manifest "pipeline/output/agriculture/$SME2_RUN_ID/search.json" \
            --download-receipt "pipeline/output/agriculture/$SME2_RUN_ID/download.json" \
            --output "$RUNNER_TEMP/dynamic-world-crop-mask/validation.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Analyze real SME2 observations
        env:
          ALGORITHM: ${{ steps.request.outputs.algorithm }}
          CROP_MASK_ENABLED: ${{ steps.crop-mask.outputs.enabled }}
          CROP_MASK_PATH: ${{ runner.temp }}/dynamic-world-crop-mask/dynamic-world-crops-probability.tif
          CROP_MASK_SOURCE: ${{ steps.crop-mask-evidence.outputs.source_label }}
          CROP_PROBABILITY_THRESHOLD: ${{ steps.crop-mask-evidence.outputs.probability_threshold }}
          CROP_MASK_VALIDATION_PATH: ${{ runner.temp }}/dynamic-world-crop-mask/validation.json
        run: |
          set -euo pipefail
          analyze_args=(--run-id "$RUN_ID" --algorithm "$ALGORITHM")
          if [ "$CROP_MASK_ENABLED" = "true" ]; then
            analyze_args+=(--crop-mask "$CROP_MASK_PATH")
            analyze_args+=(--crop-mask-source "$CROP_MASK_SOURCE")
            analyze_args+=(--crop-probability-threshold "$CROP_PROBABILITY_THRESHOLD")
            analyze_args+=(--crop-mask-validation "$CROP_MASK_VALIDATION_PATH")
          fi
          python pipeline/agriculture_sme2.py analyze "${analyze_args[@]}"

      - name: Attach NASA GPM IMERG Final rainfall context
        shell: bash
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTH_DATA }}
          ALLOW_MISSING_IMERG: ${{ steps.request.outputs.allow_missing_imerg }}
        run: |
          set +e
          python pipeline/agriculture_sme2.py rainfall --run-id "$RUN_ID" 2>&1 | tee "$RUNNER_TEMP/imerg.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "IMERG rainfall context attached." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ALLOW_MISSING_IMERG" = "true" ] && grep -Eq "no GPM IMERG Final daily V07 granules|no complete rainfall window met the 90% native-cell spatial coverage rule" "$RUNNER_TEMP/imerg.log"; then
            echo "### IMERG not yet available" >> "$GITHUB_STEP_SUMMARY"
            echo "SME2 evidence will be published without rainfall context. No missing rainfall values were fabricated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Verify and publish the web-ready Agriculture package
        run: python pipeline/agriculture_sme2.py publish --run-id "$RUN_ID"

      - name: Build the public website with the new Agriculture study
        run: npm ci && npm run build
        env:
          BEYONDERS_MODE: public
          NEXT_PUBLIC_BEYONDERS_MODE: public

      - name: Commit the publication package to master
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agriculture/current
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "Publish cloud-verified Agriculture study ($RUN_ID)"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:master
            unset AUTH_HEADER
          fi

      - name: Save non-sensitive processing receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agriculture-cloud-receipts-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            pipeline/output/agriculture/${{ env.RUN_ID }}/search.json
            pipeline/output/agriculture/${{ env.RUN_ID }}/download.json
            pipeline/output/agriculture/${{ env.RUN_ID }}/result/study.json
            pipeline/output/agriculture/${{ env.RUN_ID }}/result/quality-diagnostics.json
            pipeline/output/agriculture/${{ env.RUN_ID }}/result/web-checksums.json
            ${{ runner.temp }}/dynamic-world-crop-mask/validation.json
            pipeline/output/agriculture/${{ env.RUN_ID }}/imerg/receipt.json
            pipeline/output/agriculture/${{ env.RUN_ID }}/imerg/daily-diagnostics.json

      - name: Summarize publication
        if: success()
        run: |
          {
            echo "## Agriculture cloud publication complete"
            echo "- Run: `$RUN_ID`"
            echo "- Branch: `master`"
            echo "- Website package: `public/agriculture/current`"
            echo "- Raw SME2 and IMERG granules were not committed."
          } >> "$GITHUB_STEP_SUMMARY"
