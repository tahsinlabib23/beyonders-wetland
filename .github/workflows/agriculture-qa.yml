name: Agriculture and project QA

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'pipeline/**'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'next.config.ts'
      - '*.config.*'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'README.md'
      - 'docs/agriculture-*.md'
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: agriculture-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Compile Python modules and browser smoke tests
        run: python -m py_compile pipeline/discover_chokwe_gfm.py pipeline/test_chokwe_gfm_discovery.py pipeline/inspect_chokwe_gfm_pixels.py pipeline/test_chokwe_gfm_pixel_audit.py pipeline/recover_chokwe_native.py pipeline/test_recover_chokwe_native.py pipeline/compare_chokwe_native_gfm.py pipeline/test_compare_chokwe_native_gfm.py pipeline/agriculture_sme2.py pipeline/agriculture_sme2_inspect.py pipeline/agriculture_candidate_summary.py pipeline/download_dynamic_world_crop_mask.py pipeline/validate_dynamic_world_crop_artifact.py pipeline/test_dynamic_world_crop_artifact.py pipeline/test_dynamic_world_crop_mask.py pipeline/test_dynamic_world_workflow.py pipeline/test_agriculture_candidate_summary.py pipeline/agriculture_imerg.py pipeline/agriculture_pilot_screen.py pipeline/test_agriculture_sme2.py pipeline/test_agriculture_sme2_inspect.py pipeline/test_agriculture_imerg.py pipeline/test_agriculture_pilot_screen.py pipeline/test_agriculture_cloud_workflow.py pipeline/test_agriculture_candidate_workflow.py tests/e2e/explore_smoke.py tests/e2e/wetland_smoke.py tests/e2e/chokwe_deep_link_smoke.py tests/e2e/multi_case_module_smoke.py tests/e2e/agriculture_evidence_chain_smoke.py tests/e2e/scattering_hypothesis_smoke.py

      - name: Run full offline Python regression suite
        run: python -m unittest discover -s pipeline -p 'test_*.py' -v

      - name: Run all TypeScript unit regression tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build read-only public viewer
        run: npm run build
        env:
          BEYONDERS_MODE: public
          NEXT_PUBLIC_BEYONDERS_MODE: public

      - name: Run whole-project TypeScript check
        run: npx tsc --noEmit

      - name: Install Playwright browser-test dependency
        run: python -m pip install -r tests/e2e/requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium for production browser test
        shell: bash
        timeout-minutes: 12
        run: |
          set -u
          # The browser binary and its OS libraries fail independently.
          # `install --with-deps` bundles both, so one flaky apt mirror
          # used to re-download Chromium on every retry and burn the
          # 30-minute job budget (run 43040775627: ~20 min, exit 1;
          # run 43051379022: retries hit the job timeout). Split them:
          # download the browser first (fast to retry), then install
          # the OS libraries on their own, each with its own retries.
          for attempt in 1 2 3; do
            echo "Installing Chromium browser (attempt ${attempt}/3)"
            if python -m playwright install chromium; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Chromium browser install failed after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          for attempt in 1 2 3; do
            echo "Installing Chromium OS dependencies (attempt ${attempt}/3)"
            if python -m playwright install-deps chromium; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Chromium OS dependency install failed after 3 attempts." >&2
          exit 1

      - name: Run global mission-control and multi-workspace production browser tests
        env:
          BEYONDERS_MODE: public
          NEXT_PUBLIC_BEYONDERS_MODE: public
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3140 > /tmp/beyonders-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3140/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/beyonders-next.log
              echo "Next.js production server did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          python tests/e2e/wetland_smoke.py http://127.0.0.1:3140 | tee /tmp/e2e_wetland_run1.log
          python tests/e2e/wetland_smoke.py http://127.0.0.1:3140 | tee /tmp/e2e_wetland_run2.log
          python tests/e2e/explore_smoke.py http://127.0.0.1:3140
          python tests/e2e/multi_case_module_smoke.py http://127.0.0.1:3140
          python tests/e2e/chokwe_deep_link_smoke.py http://127.0.0.1:3140
          python tests/e2e/scattering_hypothesis_smoke.py http://127.0.0.1:3140
          python tests/e2e/agriculture_evidence_chain_smoke.py http://127.0.0.1:3140

      - name: Upload wetland responsive-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wetland-step2b-browser-evidence-${{ github.sha }}
          path: |
            /tmp/e2e_wetland_chart_*.png
            /tmp/e2e_wetland_*.png
            /tmp/e2e_wetland_run*.log
          if-no-files-found: warn
          retention-days: 3
