name: Chokwe native NISAR–GFM comparison

on:
  workflow_dispatch:
    inputs:
      recovery_workflow_run_id:
        description: "Completed GitHub Actions run ID of Chokwe native NISAR recovery (artifact must still be available)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chokwe-native-gfm-comparison
  cancel-in-progress: false

jobs:
  compare-native-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out master source
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Validate recovery workflow run ID
        env:
          RECOVERY_WORKFLOW_RUN_ID: ${{ inputs.recovery_workflow_run_id }}
        shell: bash
        run: |
          if [[ ! "${RECOVERY_WORKFLOW_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::Provide a numeric GitHub Actions workflow run ID."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Download private native recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: chokwe-native-nisar-recovery-${{ inputs.recovery_workflow_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_workflow_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/chokwe-native-recovery-package

      - name: Run native-grid positive-support comparison
        run: |
          python pipeline/compare_chokwe_native_gfm.py \
            --recovery-artifact-root /tmp/chokwe-native-recovery-package \
            --output /tmp/chokwe-native-gfm-comparison.json

      - name: Upload private native-grid comparison report
        uses: actions/upload-artifact@v4
        with:
          name: chokwe-native-gfm-comparison-${{ github.run_id }}
          path: /tmp/chokwe-native-gfm-comparison.json
          if-no-files-found: error
          retention-days: 30
