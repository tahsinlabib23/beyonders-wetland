name: Chokwe native NISAR raster recovery

on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: "Explicitly authorize reprocessing the exact published Chokwe NISAR scene pair"
        required: true
        type: choice
        options:
          - DO_NOT_RUN
          - REPROCESS_EXACT_CHOKWE_PAIR
        default: DO_NOT_RUN

permissions:
  contents: read

concurrency:
  group: chokwe-native-nisar-recovery
  cancel-in-progress: false

jobs:
  recover-native-rasters:
    if: inputs.confirm_recovery == 'REPROCESS_EXACT_CHOKWE_PAIR'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BEYONDERS_WEB_JOB: "1"
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}

    steps:
      - name: Check out master source
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Verify Earthdata credentials are configured
        shell: bash
        run: |
          if [[ -n "${EARTHDATA_TOKEN}" ]]; then
            echo "Earthdata token credential is configured."
          elif [[ -n "${EARTHDATA_USERNAME}" && -n "${EARTHDATA_PASSWORD}" ]]; then
            echo "Earthdata username/password credentials are configured."
          else
            echo "::error::Configure EARTHDATA_TOKEN, or configure both EARTHDATA_USERNAME and EARTHDATA_PASSWORD, as repository Actions secrets."
            exit 1
          fi

      - name: Validate exact recovery request without network access
        run: python pipeline/recover_chokwe_native.py --dry-run

      - name: Reprocess exact Chokwe NISAR pair and verify native rasters
        run: |
          python pipeline/recover_chokwe_native.py \
            --output-root /tmp/chokwe-native-recovery

      - name: Upload private native-raster recovery package
        uses: actions/upload-artifact@v4
        with:
          name: chokwe-native-nisar-recovery-${{ github.run_id }}
          path: /tmp/chokwe-native-recovery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
