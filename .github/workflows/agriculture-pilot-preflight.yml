name: Agriculture pilot preflight

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/agriculture-pilot-preflight.yml"
      - "pipeline/agriculture_pilot_screen.py"
      - "pipeline/agriculture_pilot_sites.json"
  workflow_dispatch:
    inputs:
      start_date:
        description: "First SME2 acquisition date (YYYY-MM-DD)"
        required: true
        default: "2026-06-17"
        type: string
      end_date:
        description: "Last SME2 acquisition date (YYYY-MM-DD)"
        required: true
        default: "2026-10-31"
        type: string

permissions:
  contents: read

jobs:
  catalogue-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Agriculture pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Screen Bangladesh pilot AOIs against NASA CMR
        run: |
          START_DATE="${{ inputs.start_date || '2026-06-17' }}"
          END_DATE="${{ inputs.end_date || '2026-10-31' }}"
          python pipeline/agriculture_pilot_screen.py \
            --start-date "$START_DATE" \
            --end-date "$END_DATE"

      - name: Upload metadata-only preflight report
        uses: actions/upload-artifact@v7
        with:
          name: agriculture-pilot-preflight
          path: pipeline/output/agriculture/pilot-screening/report.json
          if-no-files-found: error
          retention-days: 14
