name: Cloud Agriculture candidate quality inspection

on:
  push:
    branches: [master]
    paths:
      - 'pipeline/agriculture-candidate-inspection-request.json'
  workflow_dispatch:
    inputs:
      west:
        description: Baniachong AOI west longitude (WGS84)
        required: true
        default: "91.3867"
        type: string
      south:
        description: Baniachong AOI south latitude (WGS84)
        required: true
        default: "24.3533"
        type: string
      east:
        description: Baniachong AOI east longitude (WGS84)
        required: true
        default: "91.4467"
        type: string
      north:
        description: Baniachong AOI north latitude (WGS84)
        required: true
        default: "24.4133"
        type: string
      start:
        description: First SME2 search date (YYYY-MM-DD)
        required: true
        default: "2026-06-17"
        type: string
      end:
        description: Last SME2 search date (YYYY-MM-DD)
        required: true
        default: "2026-10-31"
        type: string
      series_id_141:
        description: Preflight series ID for track 141 / frame 014
        required: true
        default: "c5f219dd7bbc"
        type: string
      series_id_069:
        description: Preflight series ID for track 069 / frame 014
        required: true
        default: "540e079403d5"
        type: string

permissions:
  contents: read

concurrency:
  group: agriculture-candidate-inspection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect-both-candidates:
    if: github.ref_name == 'master' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-agri-inspection]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN_ID_141: agri-cmp-${{ github.run_id }}-141
      RUN_ID_069: agri-cmp-${{ github.run_id }}-069

    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Validate comparison request
        id: request
        shell: bash
        env:
          WEST: ${{ inputs.west }}
          SOUTH: ${{ inputs.south }}
          EAST: ${{ inputs.east }}
          NORTH: ${{ inputs.north }}
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
          SERIES_141: ${{ inputs.series_id_141 }}
          SERIES_069: ${{ inputs.series_id_069 }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import re
          from datetime import date
          from pathlib import Path

          keys = (
              "WEST", "SOUTH", "EAST", "NORTH", "START_DATE", "END_DATE",
              "SERIES_141", "SERIES_069",
          )
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              request_path = Path("pipeline/agriculture-candidate-inspection-request.json")
              payload = json.loads(request_path.read_text(encoding="utf-8"))
              values = {
                  "WEST": str(payload["west"]),
                  "SOUTH": str(payload["south"]),
                  "EAST": str(payload["east"]),
                  "NORTH": str(payload["north"]),
                  "START_DATE": str(payload["start"]),
                  "END_DATE": str(payload["end"]),
                  "SERIES_141": str(payload["series_id_141"]),
                  "SERIES_069": str(payload["series_id_069"]),
              }
          else:
              values = {key: os.environ[key] for key in keys}
          try:
              west, south, east, north = (float(values[key]) for key in ("WEST", "SOUTH", "EAST", "NORTH"))
          except ValueError as exc:
              raise SystemExit("AOI coordinates must be numeric.") from exc
          if not all(math.isfinite(value) for value in (west, south, east, north)):
              raise SystemExit("AOI coordinates must be finite numbers.")
          if not (-180 <= west < east <= 180 and -90 <= south < north <= 90):
              raise SystemExit("AOI must be a valid WGS84 bounding box.")
          if east - west > 2 or north - south > 2:
              raise SystemExit("AOI must not exceed 2 degrees in either dimension.")

          try:
              start = date.fromisoformat(values["START_DATE"])
              end = date.fromisoformat(values["END_DATE"])
          except ValueError as exc:
              raise SystemExit("Dates must use the exact YYYY-MM-DD format.") from exc
          if start.isoformat() != values["START_DATE"] or end.isoformat() != values["END_DATE"]:
              raise SystemExit("Dates must use the exact YYYY-MM-DD format.")
          if start.isoformat() < "2026-06-17" or start >= end or end > date.today():
              raise SystemExit("Date range must be valid, start no earlier than 2026-06-17, and end no later than today.")
          if (end - start).days > 366:
              raise SystemExit("Date range cannot exceed 366 days.")
          if not re.fullmatch(r"[a-f0-9]{12}", values["SERIES_141"]):
              raise SystemExit("Track 141 series ID must be 12 lowercase hexadecimal characters.")
          if not re.fullmatch(r"[a-f0-9]{12}", values["SERIES_069"]):
              raise SystemExit("Track 069 series ID must be 12 lowercase hexadecimal characters.")
          if values["SERIES_141"] == values["SERIES_069"]:
              raise SystemExit("The two candidate series IDs must be different.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key.lower()}={value}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Agriculture pipeline dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r pipeline/requirements.txt

      - name: Discover the exact CMR series for both candidates
        shell: bash
        env:
          WEST: ${{ steps.request.outputs.west }}
          SOUTH: ${{ steps.request.outputs.south }}
          EAST: ${{ steps.request.outputs.east }}
          NORTH: ${{ steps.request.outputs.north }}
          START_DATE: ${{ steps.request.outputs.start_date }}
          END_DATE: ${{ steps.request.outputs.end_date }}
        run: |
          set -euo pipefail
          python pipeline/agriculture_sme2.py search --run-id "$RUN_ID_141" \
            --west "$WEST" --south "$SOUTH" --east "$EAST" --north "$NORTH" \
            --start "$START_DATE" --end "$END_DATE"
          python pipeline/agriculture_sme2.py search --run-id "$RUN_ID_069" \
            --west "$WEST" --south "$SOUTH" --east "$EAST" --north "$NORTH" \
            --start "$START_DATE" --end "$END_DATE"

      - name: Download both exact candidate series from Earthdata
        shell: bash
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTH_DATA }}
          SERIES_141: ${{ steps.request.outputs.series_141 }}
          SERIES_069: ${{ steps.request.outputs.series_069 }}
        run: |
          set -euo pipefail
          if [ -z "${EARTHDATA_TOKEN:-}" ]; then
            echo "::error::Add an Actions secret named EARTH_DATA before running this workflow."
            exit 1
          fi
          python pipeline/agriculture_sme2.py download --run-id "$RUN_ID_141" --series-id "$SERIES_141"
          python pipeline/agriculture_sme2.py download --run-id "$RUN_ID_069" --series-id "$SERIES_069"

      - name: Inspect native HDF5 quality support for both tracks
        shell: bash
        env:
          SERIES_141: ${{ steps.request.outputs.series_141 }}
          SERIES_069: ${{ steps.request.outputs.series_069 }}
        run: |
          set -euo pipefail
          python pipeline/agriculture_sme2_inspect.py --run-id "$RUN_ID_141" \
            --expected-series-id "$SERIES_141" --label "Track 141 / frame 014"
          python pipeline/agriculture_sme2_inspect.py --run-id "$RUN_ID_141" \
            --expected-series-id "$SERIES_141" --label "Track 141 / frame 014" --algorithm DSG
          python pipeline/agriculture_sme2_inspect.py --run-id "$RUN_ID_069" \
            --expected-series-id "$SERIES_069" --label "Track 069 / frame 014"
          python pipeline/agriculture_sme2_inspect.py --run-id "$RUN_ID_069" \
            --expected-series-id "$SERIES_069" --label "Track 069 / frame 014" --algorithm DSG

      - name: Summarize the non-publishing comparison
        run: |
          python pipeline/agriculture_candidate_summary.py "$RUN_ID_141" "$RUN_ID_069"

      - name: Save non-sensitive inspection evidence
        uses: actions/upload-artifact@v7
        with:
          name: agriculture-baniachong-track-inspection-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            pipeline/output/agriculture/${{ env.RUN_ID_141 }}/search.json
            pipeline/output/agriculture/${{ env.RUN_ID_141 }}/download.json
            pipeline/output/agriculture/${{ env.RUN_ID_141 }}/result/inspection.json
            pipeline/output/agriculture/${{ env.RUN_ID_141 }}/result/inspection-dsg.json
            pipeline/output/agriculture/${{ env.RUN_ID_069 }}/search.json
            pipeline/output/agriculture/${{ env.RUN_ID_069 }}/download.json
            pipeline/output/agriculture/${{ env.RUN_ID_069 }}/result/inspection.json
            pipeline/output/agriculture/${{ env.RUN_ID_069 }}/result/inspection-dsg.json
